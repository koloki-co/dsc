# cargo-dist normally generates this workflow. Keep its five configured build
# targets explicit here so workflow data cannot become shell code or an
# unpinned container image. Update this matrix with `workspace.metadata.dist`.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish.
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

permissions:
  contents: read

env:
  CARGO_DIST_VERSION: "0.32.0"

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          submodules: recursive
      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Verify release plan
        shell: bash
        run: dist plan --tag "$RELEASE_TAG" --output-format=json

  build-local-artifacts:
    name: Build ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      DIST_TARGET: ${{ matrix.target }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          submodules: recursive
      - name: Install cargo-dist (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Install cargo-dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm "https://github.com/axodotdev/cargo-dist/releases/download/v$env:CARGO_DIST_VERSION/cargo-dist-installer.ps1" | iex
      - name: Build local artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$DIST_TARGET" in
            aarch64-apple-darwin|aarch64-unknown-linux-gnu|x86_64-apple-darwin|x86_64-unknown-linux-gnu) ;;
            *) echo "Unexpected target: $DIST_TARGET" >&2; exit 1 ;;
          esac
          dist build --tag "$RELEASE_TAG" --artifacts=local --target="$DIST_TARGET" --output-format=json > dist-manifest.json
          cp dist-manifest.json "target/distrib/${DIST_TARGET}-dist-manifest.json"
      - name: Build local artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:DIST_TARGET -ne 'x86_64-pc-windows-msvc') {
            throw "Unexpected target: $env:DIST_TARGET"
          }
          dist build --tag "$env:RELEASE_TAG" --artifacts=local --target="$env:DIST_TARGET" --output-format=json > dist-manifest.json
          Copy-Item dist-manifest.json "target/distrib/$env:DIST_TARGET-dist-manifest.json"
      - name: Upload local artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: target/distrib/**

  build-global-artifacts:
    name: Build global artifacts
    needs: build-local-artifacts
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          submodules: recursive
      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-local-*
          path: target/distrib/
          merge-multiple: true
      - name: Build global artifacts
        shell: bash
        run: |
          dist build --tag "$RELEASE_TAG" --artifacts=global --output-format=json > dist-manifest.json
          cp dist-manifest.json target/distrib/global-dist-manifest.json
      - name: Upload global artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: target/distrib/**

  host:
    name: Create GitHub release
    needs: build-global-artifacts
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          submodules: recursive
      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Fetch build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        name: Host artifacts
        shell: bash
        run: |
          dist host --tag "$RELEASE_TAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "manifest=$(jq -c '.' dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
        shell: bash
        run: |
          rm -f artifacts/*-dist-manifest.json
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  publish-homebrew-formula:
    name: Publish Homebrew formula
    needs: host
    if: ${{ !contains(inputs.tag, '-') }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          repository: pacharanero/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Fetch Homebrew formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-global
          path: Formula/
      - name: Commit formula
        shell: bash
        run: |
          git config --global user.name "$GITHUB_USER"
          git config --global user.email "$GITHUB_EMAIL"
          brew update
          brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix Formula/dsc-rs.rb || true
          git add Formula/dsc-rs.rb
          git commit -m "dsc-rs $RELEASE_TAG"
          git push

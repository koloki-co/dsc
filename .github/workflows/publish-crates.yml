name: Publish to crates.io

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish.
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust stable
        # Pinned to `master`, not `stable` - see the comment in ci.yml on the
        # equivalent step for why the version branches orphan their pins.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: cargo build
        run: cargo build --release --locked

      - name: cargo test
        env:
          DSC_LIVE_TESTS: "0"
        run: cargo test --locked --quiet

      - name: cargo publish (dry run)
        run: cargo publish --dry-run --locked

      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo publish --locked

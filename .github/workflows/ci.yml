# Gate `main` and every PR on formatting, lints, and tests. The tag-triggered
# release build (release.yml) does NOT run the suite, so this is the gate that
# keeps `main` releasable. Action SHAs are pinned with a `# vX.Y.Z` comment per
# house style; bump only after confirming the tag.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        # Plain rustup, no third-party action: GitHub runners ship rustup,
        # and the runner's rustup version only affects installation
        # mechanics, never the Rust version the code compiles with. This
        # removes the recurring dtolnay/rust-toolchain pin-rot problem
        # (version branches are force-pushed at every Rust release, and
        # the action's mutable v1 tag kept tripping zizmor's
        # ref-version-mismatch audit) - there is no third-party action
        # left to pin.
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # Live compatibility tests require DSC_LIVE_TESTS=1 and an explicit
      # configuration path. Keep the ordinary CI gate network-free.
      - name: cargo test
        env:
          DSC_LIVE_TESTS: "0"
        run: cargo test

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0
        # See the note on the "Install Rust stable" step above: plain
        # rustup, no third-party action.
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: cargo test --locked
        env:
          DSC_LIVE_TESTS: "0"
        run: cargo test --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Prebuilt binary (seconds) rather than a from-source `cargo install`.
      - name: Install cargo-audit
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-audit
          fallback: none

      # Fails the job on any RustSec advisory affecting the locked tree, so a
      # vulnerable dependency is caught here rather than waiting on a Dependabot
      # email. A genuinely unfixable transitive advisory can be quarantined in
      # `audit.toml` (`[advisories] ignore = ["RUSTSEC-XXXX-NNNN"]`) with a note.
      - name: cargo audit
        run: cargo audit

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: zizmor@1.28.0
          fallback: none
      - run: zizmor --strict-collection .
        env:
          GH_TOKEN: ${{ github.token }}

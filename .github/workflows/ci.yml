# Gate `main` and every PR on formatting, lints, and tests. The tag-triggered
# release build (release.yml) does NOT run the suite, so this is the gate that
# keeps `main` releasable. Action SHAs are pinned with a `# vX.Y.Z` comment per
# house style; bump only after confirming the tag.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        # Pinned to `master`, not `stable`: dtolnay/rust-toolchain force-pushes
        # the `stable`/`nightly`/`x.y.z` branches every time a new Rust ships,
        # which orphans any SHA pinned there (zizmor's impostor-commit check).
        # `master`'s action.yml is the generic entrypoint and only changes for
        # real changes to the action, so pinning it plus an explicit
        # `toolchain:` input is the durable form - see the upstream README's
        # "Choice of full-length commit SHA" and "Toolchain expressions".
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # Live compatibility tests require DSC_LIVE_TESTS=1 and an explicit
      # configuration path. Keep the ordinary CI gate network-free.
      - name: cargo test
        env:
          DSC_LIVE_TESTS: "0"
        run: cargo test

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0
        # See the comment on the "Install Rust stable" step above: pinned to
        # `master`, the durable generic entrypoint, not a version branch.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: cargo test --locked
        env:
          DSC_LIVE_TESTS: "0"
        run: cargo test --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Prebuilt binary (seconds) rather than a from-source `cargo install`.
      - name: Install cargo-audit
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-audit
          fallback: none

      # Fails the job on any RustSec advisory affecting the locked tree, so a
      # vulnerable dependency is caught here rather than waiting on a Dependabot
      # email. A genuinely unfixable transitive advisory can be quarantined in
      # `audit.toml` (`[advisories] ignore = ["RUSTSEC-XXXX-NNNN"]`) with a note.
      - name: cargo audit
        run: cargo audit

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: zizmor@1.28.0
          fallback: none
      - run: zizmor --strict-collection .
        env:
          GH_TOKEN: ${{ github.token }}

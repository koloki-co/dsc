# Bulk annotations cover documentation, generated files, and assets that
# cannot reliably carry an inline SPDX header. Source files use inline headers.
version = 1

[[annotations]]
path = [
    "**/*.md",
    "**/*.json",
    "Cargo.lock",
    "LICENSE",
    "requirements.txt",
    ".gitignore",
    ".githooks/pre-commit",
    "docs/assets/dsc-logo-*.svg",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Marcus Baw and Koloki Ltd"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = "wix/main.wxs"
precedence = "override"
SPDX-FileCopyrightText = "2017 Christopher R. Field"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "discourse-ui-icons/*.svg"
precedence = "override"
SPDX-FileCopyrightText = "2024 Fonticons, Inc. <https://fontawesome.com>"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
    "discourse-ui-icons/fa-bookmark-delete.svg",
    "discourse-ui-icons/fa-discourse-add-translation.svg",
    "discourse-ui-icons/fa-discourse-chevron-collapse.svg",
    "discourse-ui-icons/fa-discourse-chevron-expand.svg",
    "discourse-ui-icons/fa-discourse-dnd.svg",
    "discourse-ui-icons/fa-discourse-emojis.svg",
    "discourse-ui-icons/fa-discourse-h1.svg",
    "discourse-ui-icons/fa-discourse-h2.svg",
    "discourse-ui-icons/fa-discourse-h3.svg",
    "discourse-ui-icons/fa-discourse-h4.svg",
    "discourse-ui-icons/fa-discourse-h5.svg",
    "discourse-ui-icons/fa-discourse-other-tab.svg",
    "discourse-ui-icons/fa-discourse-sidebar.svg",
    "discourse-ui-icons/fa-discourse-sparkles.svg",
    "discourse-ui-icons/fa-discourse-text.svg",
    "discourse-ui-icons/fa-discourse-threads.svg",
]
precedence = "override"
SPDX-FileCopyrightText = "Civilized Discourse Construction Kit, Inc. <https://www.discourse.org>"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = [
    "discourse-ui-icons/fa-discourse-compress.svg",
    "discourse-ui-icons/fa-discourse-expand.svg",
]
precedence = "override"
SPDX-FileCopyrightText = "2016 Dave Gandy <https://fontawesome.com>"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "discourse-ui-icons/fa-tippy-rounded-arrow.svg"
precedence = "override"
SPDX-FileCopyrightText = "2017-present atomiks <https://atomiks.github.io/tippyjs/>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "docs/assets/koloki-logo-master-2x.png"
precedence = "override"
SPDX-FileCopyrightText = "2026 Koloki Ltd"
SPDX-License-Identifier = "LicenseRef-Koloki-Logo"
